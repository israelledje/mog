# Résolution DNS Docker dynamique (évite 502/Host unreachable après restart ou rebuild)
resolver 127.0.0.11 valid=5s ipv6=off;

# Compression Gzip pour accélérer les réponses JSON et statiques
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
gzip_min_length 256;
gzip_vary on;
gzip_proxied any;

# HTTP : redirection HTTPS + renouvellement Let's Encrypt
server {
    listen 80;
    server_name mog.dis-network.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name mog.dis-network.net;

    ssl_certificate /etc/letsencrypt/live/mog.dis-network.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mog.dis-network.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Backend API
    location /api/ {
        set $backend_api http://backend:8000;
        proxy_pass $backend_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, ngrok-skip-browser-warning" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, ngrok-skip-browser-warning" always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    location /uploads/ {
        set $backend_uploads http://backend:8000;
        proxy_pass $backend_uploads;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        set $backend_health http://backend:8000;
        proxy_pass $backend_health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location / {
        set $web_admin http://web-admin:3000;
        proxy_pass $web_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
