services:
  mongodb:
    image: mongo:7.0          # Version fixe — ne pas utiliser "latest" en production
    container_name: cargo-tracker-db
    # --replSet : active les transactions ACID et la HA future
    # --auth : authentification obligatoire
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: mogadmin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "-u", "mogadmin", "-p", "${MONGO_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # Conteneur éphémère pour configurer automatiquement le Replica Set et l'utilisateur
  mongo-setup:
    image: mongo:7.0
    container_name: cargo-tracker-mongo-setup
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network
    environment:
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_APP_PASSWORD=${MONGO_APP_PASSWORD}
    command: >
      bash -c "
      echo '⏳ Attente de MongoDB...';
      sleep 2;
      mongosh --host mongodb:27017 -u mogadmin -p $${MONGO_ROOT_PASSWORD} --authenticationDatabase admin --eval '
        try {
          rs.initiate({_id:\"rs0\", members:[{_id:0, host:\"mongodb:27017\"}]});
          print(\"✅ Replica Set initialisé\");
        } catch(e) {
          if (e.codeName === \"AlreadyInitialized\") {
            print(\"ℹ️ Replica Set déjà initialisé\");
          } else { throw e; }
        }
      ';
      echo '⏳ Attente de l'élection du PRIMARY...';
      sleep 5;
      mongosh --host mongodb:27017 -u mogadmin -p $${MONGO_ROOT_PASSWORD} --authenticationDatabase admin --eval '
        const db = db.getSiblingDB(\"cargo_app\");
        try {
          db.createUser({
            user: \"moguser\",
            pwd: \"'$${MONGO_APP_PASSWORD}'\",
            roles: [{role: \"readWrite\", db: \"cargo_app\"}]
          });
          print(\"✅ Utilisateur applicatif créé\");
        } catch(e) {
          if (e.codeName === \"DuplicateKey\" || e.code === 51003) {
            print(\"ℹ️ Utilisateur applicatif déjà existant\");
          } else { throw e; }
        }
      ';
      echo '🚀 Setup MongoDB terminé !';
      "

  backend:
    build: ./backend
    container_name: cargo-tracker-api
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - backups_data:/app/backups
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - UPLOAD_DIR=/app/uploads
      - BACKUP_DIR=/app/backups
    env_file:
      - ./backend/.env
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: always

  web-admin:
    build:
      context: ./web-admin
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: cargo-tracker-web
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - ./web-admin/.env.local
    networks:
      - app-network
    restart: always

  nginx:
    image: nginx:alpine
    container_name: cargo-tracker-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
      - web-admin
    networks:
      - app-network
    restart: always

  whatsapp-service:
    build: ./whatsapp-service
    container_name: cargo-tracker-whatsapp
    shm_size: '512mb'
    volumes:
      - whatsapp_session:/app/session
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always


networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data:
  whatsapp_session:
  uploads_data:
  backups_data:       # Volume persistant pour les sauvegardes MongoDB
